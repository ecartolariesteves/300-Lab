# Publica 303-Games/sala-de-juegos en Azure Static Web Apps.
# Solo se ejecuta cuando cambia esa carpeta (o este archivo).
# Cada Pull Request recibe su propia web de pruebas, que se borra al cerrarlo.
name: Deploy Sala de Juegos

on:
  push:
    branches: [main]
    paths:
      - '303-Games/sala-de-juegos/**'
      - '.github/workflows/sala-de-juegos.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - '303-Games/sala-de-juegos/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 303-Games/sala-de-juegos
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar la web de pruebas del PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
